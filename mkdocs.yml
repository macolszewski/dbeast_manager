site_name: DBeast documentation
site_description: User guide and reference for DBeast, a fast native database client for PostgreSQL, MySQL and SQLite, written in Rust.
site_url: https://macolszewski.github.io/dbeast_manager/
repo_url: https://github.com/macolszewski/dbeast_manager
repo_name: macolszewski/dbeast_manager
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 Maciej Olszewski. Released under the Apache License 2.0.

theme:
  name: material
  logo: images/dbeast-mark.svg
  favicon: images/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/macolszewski/dbeast_manager
      name: DBeast on GitHub

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  requirements.txt
  screenshots/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - User guide:
      - guide/getting-started.md
      - guide/data-sources.md
      - guide/sql-console.md
      - guide/results-grid.md
      - guide/explorer.md
      - guide/query-plans.md
      - guide/import-export.md
      - guide/files.md
      - guide/activity-monitor.md
      - guide/visualization.md
      - guide/ai-agents.md
      - guide/appearance.md
      - guide/sessions.md
  - Reference:
      - reference/keyboard-shortcuts.md
      - reference/performance.md
      - reference/testing.md
      - reference/limitations.md
  - Design notes:
      - Overview: design/README.md
      - design/mcp-contract.md
      - design/mcp-plan.md
      - design/mcp-skills.md
      - design/keychain-plan.md
      - design/keychain-vault.md
      - design/tls-plan.md
      - design/explain-analyse-plan.md
      - design/spatial-data-exploration.md
      - design/performance-audit-0.3.md
