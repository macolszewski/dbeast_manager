name: Release

# Pushing a version tag (v1.2.3) builds DBeast for macOS, Linux and Windows and
# publishes the packages as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            package: macos-arm64
          - name: Linux (x86-64)
            os: ubuntu-22.04
            package: linux-x86_64
          - name: Windows (x86-64)
            os: windows-latest
            package: windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos.sh
          ditto -c -k --keepParent target/release/DBeast.app "DBeast-$VERSION-${{ matrix.package }}.zip"

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          dist="DBeast-$VERSION-${{ matrix.package }}"
          mkdir "$dist"
          cp target/release/dbeast "$dist/dbeast"
          strip "$dist/dbeast"
          cp LICENSE NOTICE README.md assets/branding/icon-256.png "$dist/"
          tar -czf "$dist.tar.gz" "$dist"

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          $dist = "DBeast-$env:VERSION-${{ matrix.package }}"
          New-Item -ItemType Directory $dist | Out-Null
          Copy-Item target/release/dbeast.exe "$dist/DBeast.exe"
          Copy-Item LICENSE, NOTICE, README.md $dist
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.package }}
          path: |
            DBeast-*.zip
            DBeast-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum DBeast-* > SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the changelog section of this version, then the install notes.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          cat .github/release-notes.md >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "DBeast $version" --notes-file notes.md
